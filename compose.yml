volumes:
  dvwa:


networks:
  dvwa:


services:
  dvwa:
    build: .
    image: ghcr.io/digininja/dvwa:latest
    # Build from local source. `always` pulls the upstream image, and then
    # none of the hardening in the Dockerfile, php.ini or the Apache config is
    # present. Change back to `always` only to run the stock upstream image.
    pull_policy: build
    environment:
      - DB_SERVER=db
      # Passed explicitly rather than relying on the fallback baked into
      # config.inc.php.dist, so the credential lives in one place.
      - DB_PASSWORD=p@ssw0rd
    depends_on:
      - db
    # Uncomment the next 2 lines to serve local source
    # volumes:
    #   - ./:/var/www/html
    networks:
      - dvwa
    ports:
      - 127.0.0.1:4280:80
    restart: unless-stopped

  db:
    image: docker.io/library/mariadb:10
    environment:
      - MYSQL_ROOT_PASSWORD=dvwa
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
    volumes:
      - dvwa:/var/lib/mysql
    networks:
      - dvwa
    restart: unless-stopped
