; PHP hardening for DVWA.
;
; The Dockerfile installs this into /usr/local/etc/php/conf.d/ so the engine
; actually picks it up. Leaving it in the document root has no effect.

magic_quotes_gpc = Off

; allow_url_fopen stays on: reCAPTCHA verification uses file_get_contents().
allow_url_fopen = on

; allow_url_include turns LFI into RFI. Nothing in the app needs it.
allow_url_include = off

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

expose_php = Off

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
