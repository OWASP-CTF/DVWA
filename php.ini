; PHP hardening for DVWA.
;
; The Dockerfile installs this file into /usr/local/etc/php/conf.d/ so that the
; engine actually picks it up. Dropping it in the document root, as this file
; used to do, has no effect.

magic_quotes_gpc = Off

; allow_url_fopen has to stay on: external/recaptcha/recaptchalib.php verifies
; the CAPTCHA with file_get_contents() against the Google siteverify endpoint.
allow_url_fopen = on

; allow_url_include is what turns a local file inclusion into a remote one.
; Nothing in the application needs it, so it stays off.
allow_url_include = off

; Never render errors, warnings or stack traces into the response: they leak
; file paths, query fragments and library versions (CWE-209).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Do not advertise the PHP version in the X-Powered-By response header.
expose_php = Off

; Session hardening. The per-cookie flags are set in dvwa_start_session(),
; these are the engine level defaults. use_strict_mode makes PHP reject a
; session id it did not issue itself, which blocks session fixation.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
