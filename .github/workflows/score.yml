# Consumer workflow for the OWASP-CTF/DVWA CTF fork.
#
# OWASP-CTF/score-action does everything: checks out the PR head, mints the OIDC id-token,
# builds + boots the app, scores it against the embedded rubric, and records the result.
# The PR's untrusted code only ever runs inside containers on an --internal network, never
# on the runner host. Do NOT add a step that runs PR-controlled code directly here.
name: score

on:
  pull_request_target:
    branches: [dc34-ctf]
    types: [opened, synchronize, reopened]

concurrency:
  group: score-${{ github.repository_id }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  score:
    if: ${{ github.event.pull_request.head.sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # the action checks out the PR head to docker-build
      packages: read # the action pulls the org-internal scorer image
      id-token: write # the action mints the OIDC id-token POST /score authorizes
      pull-requests: write # the result comment
    steps:
      - name: Score + record
        uses: OWASP-CTF/score-action@ab1795f38b78065627d4d8bf449ce7eaffd762ff
        with:
          target: dvwa
          app-url: http://app
          ref: ${{ github.event.pull_request.head.sha }}
          score-image: ghcr.io/owasp-ctf/score@sha256:7d3134c34e665067acc56c872e59fa3c09ef6e3f0b0f460796a6fe5a0d5e894c

      - name: Verify scoring completed
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch ctf-score.md >/dev/null 2>&1; then
            echo "Refusing a PR-controlled ctf-score.md result file." >&2
            exit 1
          fi
          if [[ ! -s ctf-score.md ]]; then
            echo "The scorer did not produce ctf-score.md." >&2
            exit 1
          fi
          if ! grep --quiet --extended-regexp '\*\*[0-9]+ / [0-9]+\*\* challenges patched' ctf-score.md; then
            echo "The scorer result is missing the challenge summary." >&2
            exit 1
          fi
