# Security response headers for DVWA (A02:2025 Security Misconfiguration).
#
# Installed by the Dockerfile into /etc/apache2/conf-available/ and enabled with
# a2enconf. Requires mod_headers.

<IfModule mod_headers.c>
    # Do not let the browser sniff a response into a different content type.
    Header always set X-Content-Type-Options "nosniff"

    # Refuse to be framed by another origin (clickjacking).
    Header always set X-Frame-Options "SAMEORIGIN"

    # Do not leak the full URL, including the query string, to third party origins.
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Turn off browser features the application never uses.
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # Drop the PHP version banner.
    Header always unset X-Powered-By
</IfModule>

# Do not advertise the Apache version and modules in error pages or the
# Server header.
ServerTokens Prod
ServerSignature Off
